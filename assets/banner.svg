<svg width="900" height="400" xmlns="http://www.w3.org/2000/svg">
<defs>
<linearGradient id="bg" x2="1" y2="1">
    <stop stop-color="#050505"/>
    <stop offset="0.5" stop-color="#0b0b0e"/>
    <stop offset="1" stop-color="#030303"/>
</linearGradient>
<pattern id="grid"
width="40"
height="40"
patternUnits="userSpaceOnUse">
<path d="M40 0H0V40"
fill="none"
stroke="#27272a"
stroke-width="1"
opacity="0.25"/>
</pattern>
<filter id="glitchBlur">
    <feGaussianBlur stdDeviation="1"/>
</filter>
</defs>
<!-- background -->
<rect width="900" height="400" fill="url(#bg)"/>
<!-- subtle grid -->
<rect width="900"
height="400"
fill="url(#grid)"/>
<!-- broken scan fragments -->
<g stroke="#3f3f46" opacity="0.35">
<line x1="80" y1="90" x2="220" y2="90"/>
<line x1="680" y1="210" x2="840" y2="210"/>
</g>
<!-- system axis -->
<line x1="100"
y1="150"
x2="800"
y2="150"
stroke="#27272a"/>
<line x1="450"
y1="40"
x2="450"
y2="260"
stroke="#27272a"
stroke-dasharray="4 12"/>
<!-- glitch copies -->
<text x="450"
y="135"
text-anchor="middle"
font-family="monospace"
font-size="58"
letter-spacing="18"
fill="#ef4444"
opacity="0.35">
KASH
<animate attributeName="x"
values="450;446;450;453;450"
dur="3s"
repeatCount="indefinite"/>
</text>
<text x="450"
y="135"
text-anchor="middle"
font-family="monospace"
font-size="58"
letter-spacing="18"
fill="#22d3ee"
opacity="0.35">
KASH
<animate attributeName="x"
values="450;454;450;447;450"
dur="2.7s"
repeatCount="indefinite"/>
</text>
<!-- main text -->
<text x="450"
y="135"
text-anchor="middle"
font-family="monospace"
font-size="58"
letter-spacing="18"
fill="#e4e4e7">
KASH
<animate attributeName="opacity"
values="1;1;0.85;1"
dur="5s"
repeatCount="indefinite"/>
</text>
<!-- metadata -->
<text x="450"
y="180"
text-anchor="middle"
font-family="monospace"
font-size="13"
fill="#71717a">
ARCH // HYPRLAND // SESSION ACTIVE
<animate attributeName="opacity"
values="0.5;1;0.5"
dur="6s"
repeatCount="indefinite"/>
</text>
<!-- orbit dots -->
<g>
<circle cx="450" cy="80" r="7" fill="#e4e4e7" opacity="0.15"/>
<circle cx="450" cy="80" r="4.5" fill="#e4e4e7"/>
<animateTransform
attributeName="transform"
type="rotate"
from="0 450 150"
to="360 450 150"
dur="12s"
repeatCount="indefinite"/>
</g>
<g>
<circle cx="450" cy="220" r="5.5" fill="#a1a1aa" opacity="0.15"/>
<circle cx="450" cy="220" r="3.5" fill="#a1a1aa"/>
<animateTransform
attributeName="transform"
type="rotate"
from="360 450 150"
to="0 450 150"
dur="18s"
repeatCount="indefinite"/>
</g>
<!-- glitch bars -->
<rect x="300"
y="120"
width="300"
height="3"
fill="#e4e4e7"
opacity="0">
<animate attributeName="opacity"
values="0;0;0.3;0;0"
dur="4s"
repeatCount="indefinite"/>
<animate attributeName="x"
values="300;360;280;300"
dur="4s"
repeatCount="indefinite"/>
</rect>
<!-- status -->
<text x="450"
y="235"
text-anchor="middle"
font-family="monospace"
font-size="12"
fill="#52525b">
waiting_for_input_
<animate attributeName="opacity"
values="0.3;1;0.3"
dur="4s"
repeatCount="indefinite"/>
</text>

<!-- divider -->
<line x1="150" y1="300" x2="750" y2="300" stroke="#27272a"/>

<!-- disclaimer line -->
<text x="450" y="345" text-anchor="middle" font-family="monospace" font-size="14" fill="#a1a1aa">
  Kash is human and can make mistakes. Please double-check responses.
</text>
<text x="450" y="370" text-anchor="middle" font-family="monospace" font-size="14" fill="#71717a">
  (─‿‿─)
</text>
</svg>
